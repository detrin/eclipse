[package]
name = "eclipse"
version = "0.1.0"
edition = "2021"

[lib]
name = "eclipse"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "eclipse"
path = "src/main.rs"

[[bin]]
name = "eclipse-api"
path = "src/bin/eclipse-api.rs"
required-features = ["server"]

[[bin]]
name = "benchmark_minimax"
path = "benchmark_minimax.rs"

[dependencies]
colored = "2.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# rand with WASM support
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }

# Server dependencies (optional for WASM builds)
actix-web = { version = "4.3", optional = true }
actix-cors = { version = "0.6", optional = true }
tokio = { version = "1.35", features = ["full"], optional = true }

# WASM dependencies
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wee_alloc = { version = "0.4", optional = true }

[features]
default = ["server"]
server = ["actix-web", "actix-cors", "tokio"]
wasm = ["wasm-bindgen", "console_error_panic_hook", "wee_alloc"]
